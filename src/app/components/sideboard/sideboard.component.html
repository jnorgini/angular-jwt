<body>
  <span *ngIf="!isSidebarOpen" class="absolute text-white text-4xl top-3 left-2 cursor-pointer">
    <i class="fa-solid fa-bars px-2 py-2 bg-gray-900 rounded-md"
    (click)="open()"></i>
  </span>

  <div [ngClass]="{'sidebar': true, 'open': isSidebarOpen, 'closed': !isSidebarOpen}"
    class="fixed top-0 bottom-0 lg:left-0 left-[-300px] p-2 w-[300px] overflow-auto text-center bg-gray-800 rounded-md">

    <div class="text-gray-100 text-xl">
      <div class="p-2.5 mt-1 flex items-center">
        <i class="fa-solid fa-layer-group px-2 py-2 bg-blue-600 rounded-md"></i>
        <h1 class="font-bold text-gray-200 text-[15px] ml-3">Sidebar</h1>
        <i class="fa-solid fa-square-xmark ml-36 text-white hover:text-gray-300 text-2xl cursor-pointer lg:hidden"
          (click)="close()"></i>
      </div>
      <hr class="my-2 text-gray-600">
    </div>
    <div class="p-2.5 mt-3 flex items-center rounded-md px-4 duration-300 cursor-pointer bg-gray-700">
      <i class="fa-solid fa-magnifying-glass text-sm text-white"></i>
      <input type="text" placeholder="Search"
        class="text-[15px] ml-4 w-full bg-transparent text-white focus:outline-none">
    </div>

    <div class="p-2.5 mt-3 flex items-center rounded-md px-4 duration-300 cursor-pointer hover:bg-blue-600 text-white">
      <i class="fa-solid fa-house text-white"></i>
      <span class="text-[15px] ml-4 text-gray-200">Home</span>
    </div>

    <div class="p-2.5 mt-3 flex items-center rounded-md px-4 duration-300 cursor-pointer hover:bg-blue-600 text-white">
      <i class="fa-solid fa-bookmark text-white"></i>
      <span class="text-[15px] ml-4 text-gray-200">Bookmark</span>
    </div>

    <hr class="my-4 text-gray-600">

    <div class="p-2.5 mt-3 flex items-center rounded-md px-4 duration-300 cursor-pointer hover:bg-blue-600 text-white"
      (click)="dropdown()">
      <i class="fa-solid fa-message text-white"></i>
      <div class="flex justify-between w-full items-center">
        <span class="text-[15px] ml-4 text-gray-200">Chatbox</span>
        <span class="text-sm">
          <i class="fa-solid" [ngClass]="{ 'fa-chevron-down': !isArrowUp, 'fa-chevron-up': isArrowUp }"></i>
        </span>
      </div>
    </div>

    <div class="text-left text-sm font-whin mt-2 w-4/5 mx-auto text-gray-200" [ngClass]="{ 'hidden': isSubMenuHidden }">
      <h1 class="cursor-pointer p-2 hover:bg-gray-700 rounded-md mt-1">Social</h1>
      <h1 class="cursor-pointer p-2 hover:bg-gray-700 rounded-md mt-1">Personal</h1>
      <h1 class="cursor-pointer p-2 hover:bg-gray-700 rounded-md mt-1">Friends</h1>
    </div>

    <div class="p-2.5 mt-3 flex items-center rounded-md px-4 duration-300 cursor-pointer hover:bg-blue-600 text-white"
      (click)="logout()">
      <i class="fa-solid fa-sign-out text-white"></i>
      <span class="text-[15px] ml-4 text-gray-200">Logout</span>
    </div>

  </div>

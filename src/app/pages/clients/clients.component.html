<app-header (searchQueryChange)="filterClients($event)"></app-header>

<div class="w-full h-full bg-gray-900 flex items-center justify-center pt-16">
  <div class="w-3/4 mx-auto bg-gray-900 rounded-lg shadow-md shadow-black p-6 border-t-2 border-orange-500 relative -mt-10">

    <button class="absolute -top-14 left-0 bg-blue-800 shadow-sm shadow-black text-white px-4 py-2
    rounded hover:bg-blue-600 w-56 font-semibold" (click)="openCreateClient()">Add Client</button>

    <h1 class="text-2xl text-orange-400 text-center uppercase mb-8 font-semibold">clients table</h1>

    <div class="relative overflow-x-auto shadow-md sm:rounded-lg max-h-96 scrollbar-hide">
      <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-300">
        <thead class="text-xs text-gray-700 uppercase dark:text-gray-400">
          <tr>
            <th scope="col" class="px-6 py-3 bg-gray-50 dark:bg-gray-800">
              Name
            </th>
            <th scope="col" class="px-6 py-3">
              E-mail
            </th>
            <th scope="col" class="px-6 py-3 bg-gray-50 dark:bg-gray-800">
              CPF
            </th>
            <th scope="col" class="px-6 py-3">
              Phone Number
            </th>
            <th scope="col" class="px-6 py-3 bg-gray-50 dark:bg-gray-800">
              Actions
            </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let client of clients.slice().reverse()" class="border-b border-gray-200 dark:border-gray-700">
            <th scope="row"
              class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap bg-gray-50 dark:text-white dark:bg-gray-800">
              {{ client.name }}
            </th>
            <td class="px-6 py-4">
              {{ client.email }}
            </td>
            <td class="px-6 py-4 bg-gray-50 dark:bg-gray-800">
              {{ client.phone | mask: '(00) 0 0000-0000' }}
            </td>
            <td class="px-6 py-4">
              {{ client.cpf | mask: '000.000.000-00' }}
            </td>
            <td class="px-6 py-4 bg-gray-50 dark:bg-gray-800">
              <i class="fa-solid fa-pen-to-square mr-2 text-xl text-blue-600 hover:text-blue-300"
                (click)="openEditClient(client.id)"></i>
              <i class="fa-solid fa-trash-can text-red-500 text-xl hover:text-red-300"
                (click)="openConfirmation(client.id)"></i>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<app-footer></app-footer>

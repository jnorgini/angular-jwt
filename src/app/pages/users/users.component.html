<app-header (searchQueryChange)="filterUsers($event)"></app-header>

<div class="w-full h-full bg-gray-900 flex items-center justify-center">
  <div class="w-3/4 mx-auto bg-gray-900 rounded-lg shadow-md shadow-black p-6 border-t-2 border-orange-500">
    <h1 class="text-2xl text-orange-400 text-center uppercase mb-8 font-semibold">staff table</h1>

    <div class="relative overflow-x-auto shadow-md sm:rounded-lg  max-h-96 scrollbar-hide">
      <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-300">
        <thead class="text-xs text-gray-700 uppercase dark:text-gray-400">
          <tr>
            <th scope="col" class="px-6 py-3 bg-gray-50 dark:bg-gray-800">
              Username
            </th>
            <th scope="col" class="px-6 py-3">
              First Name
            </th>
            <th scope="col" class="px-6 py-3 bg-gray-50 dark:bg-gray-800">
              Last Name
            </th>
            <th scope="col" class="px-6 py-3">
              E-mail
            </th>
            <th scope="col" class="px-6 py-3 bg-gray-50 dark:bg-gray-800">
              Status
            </th>
            <th scope="col" class="px-6 py-3">
              Role
            </th>
            <th scope="col" class="px-6 py-3 bg-gray-50 dark:bg-gray-800" *ngIf="currentUser?.role === 'ADMIN'">
              Actions
            </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let users of users" class="border-b border-gray-200 dark:border-gray-700">
            <th scope="row"
              class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap bg-gray-50 dark:text-white dark:bg-gray-800">
              {{ users.username }}
            </th>
            <td class="px-6 py-4">
              {{ users.firstName }}
            </td>
            <td class="px-6 py-4 bg-gray-50 dark:bg-gray-800">
              {{ users.lastName }}
            </td>
            <td class="px-6 py-4">
              {{ users.email }}
            </td>
            <td class="px-6 py-4 bg-gray-50 dark:bg-gray-800"
            [ngClass]="{'text-green-500': users.status === 'ONLINE'}">
              {{ users.status }}
            </td>
            <td class="px-6 py-4">
              {{ users.role }}
            </td>
            <td class="px-6 py-4 bg-gray-50 dark:bg-gray-800" *ngIf="currentUser?.role === 'ADMIN'">
              <i class="fa-solid fa-pen-to-square mr-2 text-xl text-blue-600 hover:text-blue-300"
              (click)="openEditUserModal(users.id)"></i>
              <i class="fa-solid fa-trash-can text-red-500 text-xl hover:text-red-300"
              (click)="openConfirmation(users.id)"></i>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<app-footer></app-footer>
